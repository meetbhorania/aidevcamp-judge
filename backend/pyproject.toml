[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidevcamp-judge"
version = "0.1.0"
description = "Judging assistant for the AIDevCamp 2026 Agentic Hackathon"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.12,<3",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["judge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
